<div class="min-h-screen bg-base-200 flex items-center justify-center px-4">

    <div class="card w-full max-w-md bg-base-100 shadow-2xl border border-base-300">

        <div class="card-body">

            <!-- Heading -->
            <div class="text-center mb-6">

                <h1 class="text-4xl font-bold text-primary">
                    {{ loginConstants.TITLE }}
                </h1>

                <p class="text-base-content/70 mt-2">
                    {{ loginConstants.SUBTITLE }}
                </p>

            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

                <!-- Email -->
                <div class="form-control mb-4">

                    <label class="label">
                        <span class="label-text">
                            {{ loginConstants.EMAIL_LABEL }}
                        </span>
                    </label>

                    <input type="email" placeholder="{{ loginConstants.EMAIL_PLACEHOLDER }}"
                        class="input input-bordered w-full" formControlName="email" />

                </div>

                <!-- Password -->
                <div class="form-control mb-2">

                    <label class="label">
                        <span class="label-text">
                            {{ loginConstants.PASSWORD_LABEL }}
                        </span>
                    </label>

                    <input type="password" placeholder="{{ loginConstants.PASSWORD_PLACEHOLDER }}"
                        class="input input-bordered w-full" formControlName="password" />

                </div>

                <!-- Forgot Password -->
                <div class="text-right mb-6">

                    <a class="text-sm text-primary hover:underline cursor-pointer">
                        {{ loginConstants.FORGOT_PASSWORD }}
                    </a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="btn btn-primary w-full rounded-full">

                    {{ appConstants.LOGIN }}

                </button>

            </form>



            <!-- Divider -->
            <div class="divider my-6">
                OR
            </div>

            <!-- Signup Redirect -->
            <p class="text-center text-sm text-base-content/70">

                {{ loginConstants.SIGNUP_TEXT }}

                <a [routerLink]="routes.SIGNUP" class="text-primary font-semibold hover:underline ml-1">
                    {{ appConstants.SIGNUP }}
                </a>

            </p>

        </div>

    </div>

</div>
