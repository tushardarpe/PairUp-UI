<div class="chat-page bg-base-200 text-base-content">
  <div class="chat-container">

    <!-- Chat Header -->
    <header class="chat-header">
      <button class="btn btn-ghost btn-sm" type="button" (click)="back()" aria-label="Back to connections">
        ←
        <span class="hidden sm:inline">Back</span>
      </button>

      <div class="flex items-center gap-3 min-w-0">

        <!-- Target User Avatar -->
        <div class="avatar">
          <div class="w-10 rounded-full ring ring-primary ring-offset-base-100 ring-offset-1">
            <img [src]="targetPhotoUrl()" [alt]="targetName()" />
          </div>
        </div>

        <div class="min-w-0">
          <h2 class="font-semibold truncate">
            {{ targetName() }}
          </h2>

          <div class="flex items-center gap-1.5 text-xs text-base-content/60">
            @if (targetIsOnline()) {
            <span class="online-dot"></span>
            <span>Online</span>
            } @else {
            <span>{{ formatLastSeen(targetLastSeen()) }}</span>
            }
          </div>
        </div>

      </div>
    </header>


    <!-- Messages -->
    <main #messageContainer class="chat-messages">

      @if (!messages().length) {

      <div class="empty-chat">
        <div class="text-4xl">👋</div>

        <h3 class="mt-3 font-semibold">
          Start a conversation
        </h3>

        <p class="text-sm text-base-content/60">
          Say hello to {{ targetName() }}
        </p>
      </div>

      } @else {

      <div class="message-list">

        @for (m of messages(); track m.id) {

        <div class="message-row" [class.message-row-me]="m.fromMe" [class.message-row-other]="!m.fromMe">

          <div class="message-content" [class.message-content-me]="m.fromMe" [class.message-content-other]="!m.fromMe">

            <div class="chat-bubble" [class.bg-primary]="m.fromMe" [class.text-primary-content]="m.fromMe"
              [class.bg-base-300]="!m.fromMe" [class.text-base-content]="!m.fromMe">
              {{ m.text }}
            </div>

            <span class="message-time">
              {{ m.ts | date: 'shortTime' }}
            </span>

          </div>

        </div>

        }

      </div>

      }

    </main>


    <!-- Message Input -->
    <footer class="chat-footer">

      <div class="message-input-wrapper">

        <input class="input input-bordered message-input" [(ngModel)]="newMessage" (keydown.enter)="sendMessage()"
          placeholder="Write a message..." aria-label="Write a message" />

        <button class="btn btn-primary send-button" type="button" (click)="sendMessage()"
          [disabled]="!newMessage().trim()">
          <span class="hidden sm:inline">Send</span>
          <span class="sm:hidden">➤</span>
        </button>

      </div>

    </footer>

  </div>
</div>
